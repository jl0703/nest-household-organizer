micronaut:
  application:
    name: household-api
  http:
    services:
      supabase:
        url: "${supabase.url}"
        connect-timeout: 5s
        read-timeout: 5s
  security:
    authentication: bearer
    token:
      jwt:
        signatures:
          jwks:
            supabase:
              url: /auth/v1/.well-known/jwks.json
        claims-validators:
          issuer: "${supabase.url}/auth/v1"
          audience: authenticated
  server:
    cors:
      enabled: true
      configurations:
        frontend:
          allowed-origins:
            - "${FRONTEND_ORIGIN:http://localhost:3000}"

datasources:
  default:
    db-type: postgres
    dialect: POSTGRES
    driver-class-name: org.postgresql.Driver

flyway:
  datasources:
    default:
      enabled: true

supabase:
  url: "${SUPABASE_URL}"
