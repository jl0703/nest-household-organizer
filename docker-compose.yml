services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-household}
      POSTGRES_USER: ${POSTGRES_USER:-household}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-household}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-household} -d ${POSTGRES_DB:-household}"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      MICRONAUT_ENVIRONMENTS: docker
      JDBC_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-household}
      DB_USER: ${POSTGRES_USER:-household}
      DB_PASSWORD: ${POSTGRES_PASSWORD:-household}
      SUPABASE_URL: ${SUPABASE_URL}
      FRONTEND_ORIGIN: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
        NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    environment:
      BACKEND_API_URL: http://backend:8080
      NEXT_PUBLIC_SUPABASE_URL: ${NEXT_PUBLIC_SUPABASE_URL}
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ${NEXT_PUBLIC_SUPABASE_ANON_KEY}
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  postgres-data:
